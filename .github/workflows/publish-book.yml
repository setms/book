name: Deploy mdBook site to Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  vale:
    runs-on: ubuntu-latest
    container:
      image: jdkato/vale:v3.4.2
    steps:
      - uses: actions/checkout@v7
      - run: vale docs
  megalinter:
    runs-on: ubuntu-latest
    container:
      image: oxsecurity/megalinter-documentation
    steps:
      - uses: actions/checkout@v7
        with:
          # This action in a docker container means we have a folder structure
          # like `docs/docs/docs/index.md` which is confusing the FILTER_REGEX_INCLUDE.
          # We clone the repo to this path to differentiate the repo from the `docs`
          # folder and configure mega linter to use `documentation` as the workspace.
          path: documentation
      - name: Mega-linter
        run: /entrypoint.sh
        env:
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_INCLUDE: (documentation/docs/)
          DEFAULT_WORKSPACE: documentation
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t mdbook .
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with mdbook
        run: docker run --rm -v$(pwd):/data mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/html
          retention-days: 1
  deploy:
    needs:
      - vale
      - megalinter
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # GitHub Pages serves from its own storage once deployed - the
      # upload-pages-artifact is only a same-run handoff to the step
      # above, not something worth keeping around afterward.
      - name: Delete pages artifact
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq ".artifacts[] | select(.workflow_run.id==${{ github.run_id }} and .name==\"github-pages\") | .id" \
            | head -1)
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          fi
